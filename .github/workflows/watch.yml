name: Watch lounge rule sources

# Free daily check of the pages Lounge Finder's rules come from.
# Changes are written to watcher/changes.json for the weekly Claude check.
on:
  schedule:
    - cron: "17 12 * * *"   # every day at 12:17 UTC (6:17 AM Denver in winter)
  workflow_dispatch: {}      # lets you run it by hand from the Actions tab
  push:                      # and runs right away when its own settings change
    branches: [main]
    paths:
      - "watcher/sources.json"
      - "watcher/watch.py"
      - ".github/workflows/watch.yml"

permissions:
  contents: write

concurrency:
  group: watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check source pages
        run: python watcher/watch.py
      - name: Save results
        run: |
          git config user.name "lounge-finder-watcher"
          git config user.email "lounge-finder-watcher@users.noreply.github.com"
          git add watcher
          if git diff --cached --quiet; then
            echo "Nothing new to save."
          else
            git commit -m "Watcher: daily source check $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi
