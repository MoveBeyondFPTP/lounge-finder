[build]
  publish = "."
  # Rule updates are read straight from GitHub by the app, so a commit that only
  # changes rules.json skips the Netlify deploy (saves your monthly Netlify credits).
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)rules.json'"

[[headers]]
  for = "/rules.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
